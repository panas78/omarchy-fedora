# Fedora packages retired from Omarchy's default set.
#
# omarchy update never installs these and removes any that are already present
# (dependency-aware: a package still required by another installed package is
# left in place with a warning). This mirrors upstream Omarchy's retired-package
# cleanup in bin/omarchy-upgrade-to-quattro.
#
# One Fedora package name per line; blank lines and # comments are ignored.
# Add a name here when upstream drops it from omarchy-base.packages /
# omarchy-other.packages and we no longer want it installed.
#
# Retired when upstream dropped them from omarchy-base.packages (2026-10):
clang
kdenlive
llvm
obs-studio
xournalpp

# Retired when upstream moved Elsewhen in-tree as omarchy.elsewhen
# (upstream/migrations/1790528634.sh renames omacom.elsewhen entries and runs
# omarchy-pkg-drop elsewhen). The Fedora elsewhen RPM installed the old
# out-of-tree plugin to shell/plugins/omacom.elsewhen, which duplicated the
# in-tree world clock on fresh installs. Never install it; remove if present
# (dependency-aware). Config rename/dedup lives in
# fedora/migrations/*-elsewhen-retire.sh.
elsewhen
